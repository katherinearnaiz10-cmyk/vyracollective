<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Employee Portal | VYRA Collective</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07152f;color:#FAF9F6;font-family:Arial,sans-serif}#gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#07152f}.gate-card{text-align:center;padding:36px}.spinner{width:38px;height:38px;margin:0 auto 18px;border:3px solid #ffffff2b;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#app{min-height:100vh}header{min-height:76px;padding:16px 4vw;background:#0B1B3D;border-bottom:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900;letter-spacing:.12em}.right{display:flex;align-items:center;gap:14px;font-size:13px}.logout{padding:10px 15px;border:1px solid #ffffff40;border-radius:9px;background:transparent;color:white;cursor:pointer}main{padding:26px 3vw}.title{margin:0 0 6px}.desc{margin:0 0 20px;color:#b9c5da}.frame-wrap{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #ffffff20}.frame{display:block;width:100%;height:calc(100vh - 190px);min-height:720px;border:0;background:#fff}</style></head><body><section id="gate"><div class="gate-card"><div class="spinner"></div><strong>Opening VYRA Employee Portal</strong><div style="margin-top:8px;color:#b9c5da;font-size:13px">Verifying employee access…</div></div></section><div id="app" hidden><header><div class="brand">VYRA EMPLOYEE PORTAL</div><div class="right"><span id="employee"></span><button class="logout" id="logout">LOG OUT</button></div></header><main><h1 class
