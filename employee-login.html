<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login | VYRA Collective</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B1B3D;color:#FAF9F6;font-family:Arial,sans-serif}.card{width:min(92%,430px);padding:38px;border:1px solid #ffffff24;border-radius:22px;background:#ffffff0c;box-shadow:0 24px 70px #0005}.brand{font-size:26px;font-weight:800;letter-spacing:.13em}.sub{color:#b8c2d6;margin:8px 0 28px}label{display:block;font-size:13px;margin:15px 0 7px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #ffffff2b;background:#fff;color:#111;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#FAF9F6;color:#0B1B3D;font-weight:800;cursor:pointer}.msg{min-height:22px;margin-top:15px;font-size:13px;color:#ffd3d3}.back{display:block;text-align:center;margin-top:22px;color:#dbe3f3;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="brand">VYRA COLLECTIVE</div><div class="sub">Employee Portal</div><form id="login"><label>Email address</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">EMPLOYEE LOGIN</button><div class="msg" id="msg"></div></form><a class="back" href="/">← Back to VYRA Collective</a></main><script>const sb=supabase.createClient('https://ptzurrebwksuvuakgvym.supabase.co','sb_publishable_6Bkkj4-O_mw2YY9DGo3E2g_qnew4zZL');(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.replace('employee-portal.html')})();document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent='Login failed. Please check your email and password.';return}location.replace('employee-portal.html')});</script></body></html>
