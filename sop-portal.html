<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>VYRA SOP Portal</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07152f;color:#f9f9f7;font-family:Arial,sans-serif}.top{padding:18px 4vw;background:#0b1b3d;border-bottom:1px solid #ffffff1f;display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff35;padding:9px 13px;border-radius:9px}.wrap{max-width:1100px;margin:auto;padding:34px 4vw 60px}.eyebrow{font-size:12px;letter-spacing:.15em;color:#b9c5da;font-weight:800}.head h1{font-size:clamp(34px,6vw,62px);margin:8px 0}.head p{color:#b9c5da;line-height:1.6}.toolbar{display:flex;justify-content:flex-end;margin:22px 0}.btn{border:0;background:#fff;color:#07152f;font-weight:800;padding:12px 17px;border-radius:9px;cursor:pointer}.list{display:grid;gap:14px}.card{background:#0b1b3d;border:1px solid #ffffff1f;border-radius:14px;overflow:hidden}.card-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.card-head h2{font-size:18px;margin:0}.toggle{font-size:22px}.body{display:none;padding:0 20px 20px}.card.open .body{display:block}.content{white-space:pre-wrap;line-height:1.75;color:#e1e7f2;background:#07152f;padding:18px;border-radius:10px;min-height:80px}.empty{color:#8fa0bc;font-style:italic}.edit{display:none;margin-top:14px}.admin .edit{display:block}.edit textarea{width:100%;min-height:220px;background:#061126;border:1px solid #ffffff2d;color:white;padding:15px;border-radius:9px;font:inherit;line-height:1.6;resize:vertical}.edit-actions{display:flex;gap:9px;margin-top:10px}.status{font-size:12px;color:#b9c5da;margin-top:8px}.loading{text-align:center;padding:50px;color:#b9c5da}@media(max-width:600px){.wrap{padding-top:24px}.card-head{padding:16px}.body{padding:0 16px 16px}.content{padding:15px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top"><strong>VYRA • STANDARD OPERATING PROCEDURES</strong><a href="employee-portal.html">← Employee Portal</a></div><main class="wrap"><div class="head"><span class="eyebrow">EMPLOYEE RESOURCE</span><h1>VYRA SOP</h1><p>Open each section to read the latest company procedures. Admin can type and save updates directly here.</p></div><div id="list" class="list"><div class="loading">Loading SOPs…</div></div></main><script>const sb=supabase.createClient('https://ptzurrebwksuvuakgvym.supabase.co','sb_publishable_6Bkkj4-O_mw2YY9DGo3E2g_qnew4zZL');const ADMIN='katherinearnaiz10@gmail.com';let userEmail='';async function save(id,ta,status,contentEl){status.textContent='Saving…';const content=ta.value;const {error}=await sb.from('sop_sections').update({content,updated_at:new Date().toISOString(),updated_by:userEmail}).eq('id',id);if(error){status.textContent='Could not save. '+error.message;return}contentEl.textContent=content||'No SOP text added yet.';contentEl.classList.toggle('empty',!content.trim());status.textContent='Saved ✓'}async function init(){const {data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('employee-login.html?next=sop');return}userEmail=(data.session.user.email||'').toLowerCase();const admin=userEmail===ADMIN;if(admin)document.body.classList.add('admin');const {data:rows,error:e}=await sb.from('sop_sections').select('*').order('sort_order').order('id');const list=document.getElementById('list');if(e){list.innerHTML='<div class="loading">Unable to load SOPs.</div>';return}list.innerHTML='';rows.forEach(r=>{const card=document.createElement('section');card.className='card';const head=document.createElement('div');head.className='card-head';const h=document.createElement('h2');h.textContent=r.title;const t=document.createElement('span');t.className='toggle';t.textContent='+';head.append(h,t);const body=document.createElement('div');body.className='body';const content=document.createElement('div');content.className='content'+(r.content.trim()?'':' empty');content.textContent=r.content||'No SOP text added yet.';body.appendChild(content);if(admin){const edit=document.createElement('div');edit.className='edit';const ta=document.createElement('textarea');ta.value=r.content;ta.placeholder='Type the '+r.title+' here…';const acts=document.createElement('div');acts.className='edit-actions';const btn=document.createElement('button');btn.className='btn';btn.textContent='SAVE SOP';const status=document.createElement('div');status.className='status';btn.onclick=()=>save(r.id,ta,status,content);acts.appendChild(btn);edit.append(ta,acts,status);body.appendChild(edit)}head.onclick=()=>{card.classList.toggle('open');t.textContent=card.classList.contains('open')?'−':'+'};card.append(head,body);list.appendChild(card)})}init();</script></body></html>
